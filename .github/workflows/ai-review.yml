name: AI Review

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI Code Review
    if: github.event.label.name == 'ai-review' && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.301

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR_NUMBER" > /tmp/pr.diff

      - name: Run AI Review
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ ! -s /tmp/pr.diff ]; then
            echo "Empty diff, skipping AI review"
            exit 0
          fi

          PROMPT=$(cat .github/ai-review/prompt.md)

          CLAUDE_EXIT=0
          claude -p "$PROMPT" \
            --model sonnet \
            --bare \
            --setting-sources user \
            --tools "" \
            --permission-mode dontAsk \
            --max-budget-usd 1 \
            --output-format json < /tmp/pr.diff > /tmp/review.json || CLAUDE_EXIT=$?

          if [ "$CLAUDE_EXIT" -ne 0 ] || ! REVIEW=$(jq -er 'select(.is_error != true) | .result | select(type == "string" and length > 0)' /tmp/review.json); then
            echo "::error::AI review failed (exit $CLAUDE_EXIT): $(jq -c '{subtype, terminal_reason, is_error, total_cost_usd, errors, result}' /tmp/review.json)"
            exit 1
          fi
          COST=$(jq -r '.total_cost_usd // "unknown"' /tmp/review.json)
          MODEL=$(jq -r '(.modelUsage // {}) | keys[0] // "unknown"' /tmp/review.json)

          printf "%s\n\n---\n*AI review · model: \`%s\` · commit: \`%s\` · cost: \$%s USD*" "$REVIEW" "$MODEL" "${HEAD_SHA:0:7}" "$COST" > /tmp/comment.md

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -s /tmp/comment.md ]; then
            gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body-file /tmp/comment.md
          fi
