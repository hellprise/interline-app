name: AI Review

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI Code Review
    if: github.event.label.name == 'ai-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.301

      - name: Run AI Review and comment on PR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PROMPT=$(cat .github/ai-review/prompt.md)
          gh pr diff "$PR_NUMBER" > /tmp/pr.diff

          claude -p "$PROMPT" \
            --bare \
            --setting-sources user \
            --tools "" \
            --permission-mode dontAsk \
            --max-budget-usd 1 \
            --output-format json < /tmp/pr.diff > /tmp/review.json

          REVIEW=$(jq -r '.result' /tmp/review.json)
          COST=$(jq -r '.total_cost_usd' /tmp/review.json)

          printf "%s\n\n---\n*Estimated AI review cost: \$%s USD*" "$REVIEW" "$COST" > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
