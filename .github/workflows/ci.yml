name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      core-db:
        image: postgres:18.6
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interline -d interline_core"
          --health-interval 2s 
          --health-timeout 3s 
          --health-retries 15
        env:
          POSTGRES_USER: interline
          POSTGRES_PASSWORD: interline
          POSTGRES_DB: interline_core
    env:
      DATABASE_URL: postgresql://interline:interline@localhost:5432/interline_core
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @interline/core exec prisma generate --no-hints
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm run test
