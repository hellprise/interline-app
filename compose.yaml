services:
  core-db:
    image: postgres:18.6
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: interline
      POSTGRES_PASSWORD: interline
      POSTGRES_DB: interline_core
    volumes:
      - core-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interline -d interline_core"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  core-db-data:
